name: Build Waveshare 7B
on:
  push:
    branches: [waveshare-7b-custom]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/host_tests.sh
  firmware:
    needs: host-checks
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware and flash assets
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          bash tools/fetch_airports.sh
          bash tools/fetch_flags.sh
          idf.py -B build-7b -D IDF_TARGET=esp32s3 -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.board.7b' build
      - name: Package private update files
        shell: bash
        run: |
          mkdir -p ota-7b
          cp build-7b/esp32flight.bin ota-7b/
          python3 -c 'import json; p=json.load(open("build-7b/project_description.json")); assert p["project_version"].endswith("-7b"); print(json.dumps({"version":p["project_version"]}))' > ota-7b/manifest.json
      - name: Upload private update files
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-7b-private-update
          path: ota-7b/
          if-no-files-found: error
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-7b
          path: |
            build-7b/**/*.bin
            build-7b/flasher_args.json
          if-no-files-found: error
